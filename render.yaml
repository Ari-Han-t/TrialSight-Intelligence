services:
  - type: web
    name: trialsight-intelligence
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_ORIGINS
        value: https://trialsight-intelligence.vercel.app,http://localhost:3000
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
