# Free-tier deployment: one container serves the API and the UI on the same origin.
# Free instances have no persistent disk, so uploads reset when the service restarts.
services:
  - type: web
    name: trialsight-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SERVE_FRONTEND
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY      # optional: without it answers are extractive with citations
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash
